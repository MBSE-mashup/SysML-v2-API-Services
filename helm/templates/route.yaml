{{- if .Values.app.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "sysml-v2-api-services.fullname" . }}
  labels:
    {{- include "sysml-v2-api-services.labels" . | nindent 4 }}
spec:
  host: {{ .Values.app.route.host }}
  to:
    kind: Service
    name: {{ include "sysml-v2-api-services.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
