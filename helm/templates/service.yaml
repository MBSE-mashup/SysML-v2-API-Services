apiVersion: v1
kind: Service
metadata:
  name: {{ include "sysml-v2-api-services.fullname" . }}
  labels:
    {{- include "sysml-v2-api-services.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sysml-v2-api-services.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sysml-v2-api-services.fullname" . }}-db
  labels:
    {{- include "sysml-v2-api-services.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "sysml-v2-api-services.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
